<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#e41827"/><title>HK Engine – Ice Hockey</title>
<style>
:root{--bg:#0e0f13;--c:#171922;--c2:#1f2230;--t:#eceef5;--m:#8b90a5;--r:#e41827;--g:#22c55e;--y:#f5b301;--b:#2a2e40}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--r);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-style:italic;font-weight:900;font-size:18px}#st{font-size:11px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto}nav button,.btn{background:var(--c2);color:var(--t);border:1px solid var(--b);border-radius:9px;padding:8px 14px;font-weight:700;white-space:nowrap}
nav button.on,.btn.pri{background:var(--r);border-color:var(--r)}main{padding:10px}.sec{display:none}.sec.on{display:block}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;gap:8px}.lg{color:var(--m);font-size:11px}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}th{color:var(--m);font-weight:600;text-align:left;font-size:11px}td,th{padding:5px 3px;border-top:1px solid var(--b)}
.PLAY{color:var(--g);font-weight:800}.LEAN{color:var(--y);font-weight:800}.NO{color:var(--m)}.win{color:var(--g)}.loss{color:var(--r)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}details summary{color:var(--m);font-size:12px;margin-top:6px}
.empty{color:var(--m);text-align:center;padding:30px 10px}.pill{background:var(--c2);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--m)}
.bar{height:6px;background:var(--c2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
</style></head><body>
<header><b>🏒 HK Engine</b><span id="st">starting…</span></header>
<nav id="nav"><button data-s="m" class="on">Matches</button><button data-s="p">Auto Parlay</button><button data-s="t">Tracker</button><button data-s="l">Learning</button></nav>
<main>
<section id="s-m" class="sec on"><div class="row"><button class="btn pri" id="bT">Today</button><button class="btn" id="bN">Tomorrow</button><button class="btn" id="bR">Refresh</button></div><div id="games"></div></section>
<section id="s-p" class="sec"><div id="parlay"></div></section>
<section id="s-t" class="sec"><div class="row"><button class="btn" id="bS">Settle now</button><button class="btn" id="bX">Copy JSON</button><button class="btn" id="bC">Clear</button></div><div id="trk"></div></section>
<section id="s-l" class="sec"><div id="learn"></div></section>
</main>
<script>
/* ===================== CONFIG ===================== */
const CFG={
  WORKER:"https://thebetceo-engine.ridwantunde636.workers.dev/", // CORS fallback: WORKER?url=<encoded>
  LEAGUES:[["nhl","NHL"],["mens-college-hockey","NCAA"]],       // ESPN hockey slugs (auto-fetched)
  FORM_N:10,   // games for goals for/against
  DEEP_N:5,    // games opened for period + TOI detail
  PRIOR_TEAM:3.05, P1_SHARE:0.31, HOME:1.04, K:8,   // league priors, home edge, shrink weight
  BOOK_W:0.5,  // weight on book total when ESPN supplies one (audit: own model ~= book line, so anchor to it)
  PLAY:0.60, LEAN:0.555, SHRINK0:0.7, MIN_LEARN:30, SETTLE_AFTER_H:3.5
};
const $=s=>document.querySelector(s),LS="hk.v1.";
const store={get(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ESPN=sl=>"https://site.api.espn.com/apis/site/v2/sports/hockey/"+sl;
const num=x=>{const v=x&&typeof x==="object"?(x.value??x.displayValue):x;const n=parseFloat(v);return isFinite(n)?n:NaN};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};
const half=x=>Math.floor(x)+0.5>x+0.5?Math.floor(x)-0.5:Math.floor(x)+0.5; // nearest .5
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const fmtT=ms=>new Date(ms).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
const mm=m=>{const h=Math.floor(m);return h+":"+String(Math.round((m-h)*60)).padStart(2,"0")};
function setSt(t){$("#st").textContent=t}

/* ===================== FETCH (all automatic) ===================== */
async function getJ(url,ms=9000){
  const tryF=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}};
  try{return await tryF(url)}catch(e){try{return await tryF(CFG.WORKER+"?url="+encodeURIComponent(url))}catch(e2){return null}}
}
async function pool(items,n,fn){const out=new Array(items.length);let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;try{out[k]=await fn(items[k],k)}catch(e){out[k]=null}}}));return out}
function parseEvent(e,slug,lname){
  const c=(e.competitions||[])[0];if(!c)return null;
  const H=c.competitors.find(x=>x.homeAway==="home"),A=c.competitors.find(x=>x.homeAway==="away");if(!H||!A)return null;
  const ls=x=>(x.linescores||[]).map(num);const o=(c.odds||[])[0]||{};
  const tot=num(o.overUnder);const st=(e.status||c.status||{}).type||{};
  return {id:String(e.id),slug,league:lname,date:Date.parse(e.date),completed:!!st.completed,state:st.state,status:st.name||"",
    total:isFinite(tot)?tot:null,
    h:{id:String(H.team.id),name:H.team.displayName,ab:H.team.abbreviation,score:num(H.score),ls:ls(H)},
    a:{id:String(A.team.id),name:A.team.displayName,ab:A.team.abbreviation,score:num(A.score),ls:ls(A)}};
}
async function fixtures(day){
  const d=ymd(new Date(Date.now()+day*864e5)),out=[];
  await Promise.all(CFG.LEAGUES.map(async([sl,nm])=>{const j=await getJ(ESPN(sl)+"/scoreboard?dates="+d+"&limit=200");
    for(const e of (j&&j.events)||[]){const g=parseEvent(e,sl,nm);if(g)out.push(g)}}));
  return out.sort((a,b)=>a.date-b.date);
}
const mem={};
async function summary(slug,id){const k=slug+":"+id;if(mem[k]!==undefined)return mem[k];
  const j=await getJ(ESPN(slug)+"/summary?event="+id);mem[k]=j;return j}
function periodGoals(j,tid){ // goals per period for team tid from a summary
  try{const c=j.header.competitions[0].competitors.find(x=>String(x.team?x.team.id:x.id)===tid||String(x.id)===tid);
    return (c.linescores||[]).map(num)}catch(e){return[]}}
function toiOf(j,tid){const res=[];
  try{for(const t of j.boxscore.players){if(String(t.team.id)!==tid)continue;
    for(const g of t.statistics){if(/goal/i.test(g.name||""))continue;const ix=(g.labels||[]).findIndex(l=>/^TOI$/i.test(l));if(ix<0)continue;
      for(const a of g.athletes||[]){const s=(a.stats||[])[ix];if(!s)continue;const p=String(s).split(":");const m=p.length===2?(+p[0]+(+p[1])/60):parseFloat(s);
        if(isFinite(m)&&m>0)res.push({pid:String(a.athlete.id),name:a.athlete.displayName,pos:/def/i.test(g.name||"")?"D":"F",m})}}}}catch(e){}
  return res}
const formC={};
async function teamForm(slug,tid){
  const k=slug+":"+tid;if(formC[k])return formC[k];
  const p=(async()=>{
    const out={n:0,gf:NaN,ga:NaN,games:[],p1:[],p1a:[],toi:{}};
    const seasons=[null];let evs=[];
    const j=await getJ(ESPN(slug)+"/teams/"+tid+"/schedule");
    for(const e of (j&&j.events)||[]){const c=(e.competitions||[])[0];if(!c||!((e.status||c.status||{}).type||{}).completed)continue;
      const me=c.competitors.find(x=>String(x.team?x.team.id:x.id)===tid),op=c.competitors.find(x=>x!==me);if(!me||!op)continue;
      const f=num(me.score),a=num(op.score);if(isFinite(f)&&isFinite(a))evs.push({id:String(e.id),date:Date.parse(e.date),f,a})}
    evs.sort((x,y)=>y.date-x.date);evs=evs.slice(0,CFG.FORM_N);
    out.n=evs.length;out.games=evs;out.gf=mean(evs.map(x=>x.f));out.ga=mean(evs.map(x=>x.a));
    const deep=await pool(evs.slice(0,CFG.DEEP_N),3,async ev=>({ev,j:await summary(slug,ev.id)}));
    const tp={};
    for(const d of deep){if(!d||!d.j)continue;
      const mine=periodGoals(d.j,tid);if(mine.length&&isFinite(mine[0]))out.p1.push(mine[0]);
      try{const c=d.j.header.competitions[0].competitors.find(x=>String(x.team?x.team.id:x.id)!==tid&&String(x.id)!==tid);const l=(c.linescores||[]).map(num);if(l.length&&isFinite(l[0]))out.p1a.push(l[0])}catch(e){}
      for(const r of toiOf(d.j,tid)){(tp[r.pid]=tp[r.pid]||{name:r.name,pos:r.pos,m:[]}).m.push(r.m)}}
    out.toi=tp;return out})();
  formC[k]=p;return p;
}

/* ===================== MODEL (Poisson goals) ===================== */
function pmfCdf(l,k){let p=Math.exp(-l),s=p;for(let i=1;i<=k;i++){p*=l/i;s+=p}return s}
const pOver=(l,L)=>Math.max(0,Math.min(1,1-pmfCdf(l,Math.floor(L))));
const Phi=z=>{const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
function learnState(){return store.get("learn",{})}
function shrinkFor(mk){const L=learnState()[mk];if(!L||L.n<CFG.MIN_LEARN)return CFG.SHRINK0;
  const hit=L.hits/L.n,mp=L.sumP/L.n;if(mp<=0.52)return CFG.SHRINK0;
  return Math.max(0.15,Math.min(1,(hit-0.5)/(mp-0.5)))}
function scaleFor(mk){const L=learnState()[mk];if(!L||L.n<CFG.MIN_LEARN||!L.sumProj)return 1;
  const bias=L.sumErr/L.sumProj;return 1+Math.max(-0.08,Math.min(0.08,bias))} // sumErr=actual-proj
const sh=(v,n)=>((isFinite(v)?v:CFG.PRIOR_TEAM)*n+CFG.PRIOR_TEAM*CFG.K)/(n+CFG.K);
function gate(vals,L,side){ // BB-style recent-form direction veto: >=60% of recent games must agree
  const v=vals.filter(isFinite);if(v.length<4)return true;
  const ok=v.filter(x=>side==="OVER"?x>L:x<L).length;return ok>=Math.ceil(v.length*0.6)}
function mkPick(mk,market,lam,L,vals,extra){
  const p=pOver(lam,L),side=p>=0.5?"OVER":"UNDER";let pr=side==="OVER"?p:1-p;
  pr=0.5+(pr-0.5)*shrinkFor(mk);
  let grade=pr>=CFG.PLAY?"PLAY":pr>=CFG.LEAN?"LEAN":"NO PLAY";
  let gated=false;if(grade!=="NO PLAY"&&!gate(vals,L,side)){grade="NO PLAY";gated=true}
  return Object.assign({mk,market,line:L,side,proj:+lam.toFixed(2),prob:+pr.toFixed(3),grade,gated,pick:(grade==="NO PLAY"?"":grade+" ")+side+" "+L},extra||{});
}
function analyze(g,fH,fA){
  const lg=CFG.PRIOR_TEAM,aH=sh(fH.gf,fH.n),dH=sh(fH.ga,fH.n),aA=sh(fA.gf,fA.n),dA=sh(fA.ga,fA.n);
  let lh=aH*dA/lg*CFG.HOME,la=aA*dH/lg/CFG.HOME;
  if(g.total){const t=lh+la,r=(t*(1-CFG.BOOK_W)+g.total*CFG.BOOK_W)/t;lh*=r;la*=r}
  const sf=scaleFor("ft");lh*=sf;la*=sf;
  const shr=(arr,n)=>{const v=arr.filter(isFinite);return (mean(v)*v.length+CFG.P1_SHARE*0)/1};
  const p1sh=f=>{const gf=f.p1.length?mean(f.p1)/Math.max(0.5,mean(f.games.slice(0,f.p1.length).map(x=>x.f))):CFG.P1_SHARE;const n=f.p1.length;return (gf*n+CFG.P1_SHARE*6)/(n+6)};
  const sH=p1sh(fH),sA=p1sh(fA);
  const p1h=lh*sH*scaleFor("p1")/ (scaleFor("ft")||1),p1a=la*sA*scaleFor("p1")/(scaleFor("ft")||1);
  const totL=g.total||half(lh+la),p1L=half(p1h+p1a),hL=half(lh),aL=half(la);
  const tg=(x,y)=>x.games.map((q,i)=>q.f+q.a); // totals per game
  const picks=[
    mkPick("ft","Total Goals",lh+la,totL,[...tg(fH).slice(0,5),...tg(fA).slice(0,5)],{src:g.total?"book":"model"}),
    mkPick("p1","1st Period Total Goals",p1h+p1a,p1L,[...fH.p1.map((v,i)=>v+(fH.p1a[i]??NaN)),...fA.p1.map((v,i)=>v+(fA.p1a[i]??NaN))],{src:"model"}),
    mkPick("th",g.h.name+" Total Goals",lh,hL,fH.games.slice(0,5).map(x=>x.f),{team:"h",src:"model"}),
    mkPick("ta",g.a.name+" Total Goals",la,aL,fA.games.slice(0,5).map(x=>x.f),{team:"a",src:"model"})];
  // player props: Time on Ice (projection ladder; no book line is auto-available, so not tracked)
  const toi=[];
  for(const [f,side] of [[fH,g.h.name],[fA,g.a.name]]){
    const rows=Object.values(f.toi).filter(p=>p.m.length>=3).map(p=>{const mu=mean(p.m),s=Math.max(1,sd(p.m)||1),m3=mean(p.m.slice(0,3)),w=0.6*mu+0.4*m3;return {name:p.name,pos:p.pos,team:side,mu:w,s,n:p.m.length}}).sort((x,y)=>y.mu-x.mu).slice(0,3);
    for(const r of rows){const base=Math.floor(r.mu)+0.5;r.ladder=[base-1,base,base+1].map(L=>({L,p:1-Phi((L-r.mu)/r.s)}));toi.push(r)}}
  return {lh,la,picks,toi,hasForm:fH.n>=3&&fA.n>=3,nH:fH.n,nA:fA.n};
}

/* ===================== STATE / UI ===================== */
let DAY=0,GAMES=[];
async function load(){
  setSt("fetching fixtures…");$("#games").innerHTML='<div class="empty">Loading…</div>';
  const fx=(await fixtures(DAY)).filter(g=>!g.completed);GAMES=[];
  if(!fx.length){$("#games").innerHTML='<div class="empty">No hockey matches found for this day.</div>';renderParlay();setSt("no matches");return}
  let done=0;
  await pool(fx,2,async g=>{
    setSt("analyzing "+(++done)+"/"+fx.length);
    const [fH,fA]=await Promise.all([teamForm(g.slug,g.h.id),teamForm(g.slug,g.a.id)]);
    const r=analyze(g,fH,fA);if(r.hasForm){GAMES.push({g,r});autoTrack(g,r)}
    renderGames();renderParlay()});
  renderGames();renderParlay();renderTracker();renderLearn();setSt(GAMES.length+" analyzed · "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",hour12:true}));
}
function renderGames(){
  const el=$("#games");if(!GAMES.length){el.innerHTML='<div class="empty">Analyzing…</div>';return}
  el.innerHTML=GAMES.map(({g,r})=>`<div class="card"><div class="hd"><b>${esc(g.a.name)} @ ${esc(g.h.name)}</b><span class="pill">${esc(g.league)}</span></div>
  <div class="lg">${fmtT(g.date)} · form ${r.nA}/${r.nH} games · λ ${r.la.toFixed(2)} – ${r.lh.toFixed(2)}${g.total?" · book total "+g.total:""}</div>
  <table><tr><th>Market</th><th>Line</th><th>Proj</th><th>Pick</th><th>Prob</th></tr>${r.picks.map(p=>`<tr><td>${esc(p.market)}</td><td>${p.line}</td><td>${p.proj}</td><td class="${p.grade==="NO PLAY"?"NO":p.grade}">${p.grade==="NO PLAY"?(p.gated?"NO PLAY (form gate)":"NO PLAY"):esc(p.pick)}</td><td>${(p.prob*100).toFixed(1)}%</td></tr>`).join("")}</table>
  <details><summary>Player props · Time on Ice (${r.toi.length})</summary>${r.toi.length?`<table><tr><th>Player</th><th>Proj TOI</th><th>P(over) ladder</th></tr>${r.toi.map(t=>`<tr><td>${esc(t.name)} <span class="lg">${t.pos}</span></td><td>${mm(t.mu)}</td><td class="lg">${t.ladder.map(l=>"O"+l.L+" "+(l.p*100).toFixed(0)+"%").join(" · ")}</td></tr>`).join("")}</table>`:'<div class="lg">TOI data not available yet for these teams.</div>'}</details></div>`).join("");
}

/* ===================== AUTO PARLAY (analyzed matches only) ===================== */
function renderParlay(){
  const el=$("#parlay");
  const legs=[];for(const {g,r} of GAMES){const best=r.picks.filter(p=>p.grade!=="NO PLAY").sort((a,b)=>b.prob-a.prob)[0];if(best)legs.push({g,p:best})}
  legs.sort((a,b)=>b.p.prob-a.p.prob);
  if(legs.length<2){el.innerHTML='<div class="empty">'+(GAMES.length?"Not enough qualifying legs yet (need 2+ matches with a PLAY/LEAN pick).":"No matches analyzed for this day.")+"</div>";return}
  const mk=(name,n)=>{const L=legs.slice(0,n);if(L.length<n)return"";const pr=L.reduce((s,x)=>s*x.p.prob,1);
    return `<div class="card"><div class="hd"><b>${name}</b><span class="PLAY">${(pr*100).toFixed(1)}% · fair ${(1/pr).toFixed(2)}</span></div>${L.map(x=>`<div style="padding:5px 0;border-top:1px solid var(--b)"><div>${esc(x.p.pick)} <span class="lg">· ${esc(x.p.market)}</span></div><div class="lg">${esc(x.g.a.ab)} @ ${esc(x.g.h.ab)} · ${fmtT(x.g.date)} · ${(x.p.prob*100).toFixed(1)}%</div></div>`).join("")}</div>`};
  el.innerHTML=mk("Safe · 2 legs",2)+mk("Balanced · 3 legs",3)+mk("Max · 4 legs",4)+'<div class="lg">One leg per match, from today\'s analyzed fixtures only. Combined probability assumes independent matches.</div>';
}

/* ===================== TRACKER + SETTLEMENT ===================== */
const picksDB=()=>store.get("picks",[]);
function autoTrack(g,r){
  const db=picksDB();let ch=false;
  for(const p of r.picks){if(p.grade==="NO PLAY")continue;const id=g.id+"|"+p.mk;if(db.some(x=>x.id===id))continue;
    db.push({id,eventId:g.id,slug:g.slug,league:g.league,home:g.h.name,away:g.a.name,hid:g.h.id,aid:g.a.id,date:g.date,created:Date.now(),mk:p.mk,market:p.market,line:p.line,side:p.side,pick:p.pick,grade:p.grade,proj:p.proj,prob:p.prob,status:"pending",actual:null});ch=true}
  if(ch)store.set("picks",db)}
function actualFor(p,ev){const hs=ev.h.ls,as=ev.a.ls;
  if(p.mk==="ft")return ev.h.score+ev.a.score;
  if(p.mk==="th")return ev.h.score;if(p.mk==="ta")return ev.a.score;
  if(p.mk==="p1")return (isFinite(hs[0])&&isFinite(as[0]))?hs[0]+as[0]:NaN;return NaN}
async function settle(){
  const db=picksDB(),due=db.filter(p=>p.status==="pending"&&Date.now()>p.date+CFG.SETTLE_AFTER_H*36e5);
  if(!due.length){setSt("nothing to settle");return}
  const keys=[...new Set(due.map(p=>p.slug+"|"+ymd(new Date(p.date))))];const evs={};
  await pool(keys,3,async k=>{const [sl,d]=k.split("|");const j=await getJ(ESPN(sl)+"/scoreboard?dates="+d+"&limit=200");
    for(const e of (j&&j.events)||[]){const g=parseEvent(e,sl,"");if(g)evs[sl+"|"+g.id]=g}});
  const L=learnState();let n=0;
  for(const p of due){const ev=evs[p.slug+"|"+p.eventId];if(!ev)continue;
    if(/postpon|cancel|suspend/i.test(ev.status)){p.status="void";n++;continue}
    if(!ev.completed)continue;const a=actualFor(p,ev);if(!isFinite(a))continue;
    p.actual=a;p.status=((a>p.line)===(p.side==="OVER"))?"win":"loss";p.settledAt=Date.now();n++;
    const s=L[p.mk]=L[p.mk]||{n:0,hits:0,sumP:0,sumErr:0,sumProj:0};s.n++;s.hits+=p.status==="win"?1:0;s.sumP+=p.prob;s.sumErr+=a-p.proj;s.sumProj+=p.proj}
  store.set("picks",db);store.set("learn",L);setSt("settled "+n);renderTracker();renderLearn();renderGames()}
function renderTracker(){
  const db=picksDB().sort((a,b)=>b.date-a.date),w=db.filter(p=>p.status==="win").length,l=db.filter(p=>p.status==="loss").length,pe=db.filter(p=>p.status==="pending").length;
  $("#trk").innerHTML=`<div class="card"><b>${w}-${l}</b> <span class="lg">(${w+l?(100*w/(w+l)).toFixed(1):"–"}%) · ${pe} pending · ${db.length} total</span></div>`+
  (db.length?db.slice(0,300).map(p=>`<div class="card"><div class="hd"><b>${esc(p.pick)}</b><span class="${p.status}">${p.status.toUpperCase()}${p.actual!=null?" · "+p.actual:""}</span></div><div class="lg">${esc(p.market)} · ${esc(p.away)} @ ${esc(p.home)} · ${fmtT(p.date)} · proj ${p.proj} · ${(p.prob*100).toFixed(1)}%</div></div>`).join(""):'<div class="empty">Picks are tracked automatically when matches are analyzed.</div>');
}

/* ===================== LEARNING PAGE ===================== */
function renderLearn(){
  const db=picksDB().filter(p=>p.status==="win"||p.status==="loss"),L=learnState();
  const rate=a=>a.length?(100*a.filter(p=>p.status==="win").length/a.length):NaN,f=v=>isFinite(v)?v.toFixed(1)+"%":"–";
  const mk=[["ft","Total Goals"],["p1","1st Period Goals"],["th","Home Team Goals"],["ta","Away Team Goals"]];
  let h=`<div class="card"><b>Self-learning status</b><div class="lg">Learns per market after ${CFG.MIN_LEARN} settled picks: projection bias correction (±8% cap) and confidence shrink. Until then confidence is shrunk to ${CFG.SHRINK0}.</div>
  <table><tr><th>Market</th><th>Settled</th><th>Hit</th><th>Avg prob</th><th>Bias</th><th>Shrink</th></tr>`;
  for(const [k,n] of mk){const s=L[k];h+=`<tr><td>${n}</td><td>${s?s.n:0}</td><td>${s&&s.n?f(100*s.hits/s.n):"–"}</td><td>${s&&s.n?f(100*s.sumP/s.n):"–"}</td><td>${s&&s.n?(s.sumErr/s.n).toFixed(2):"–"}</td><td>${shrinkFor(k).toFixed(2)}</td></tr>`}
  h+="</table></div>";
  const bk=[[0.5,0.55],[0.55,0.6],[0.6,0.65],[0.65,1]];
  h+=`<div class="card"><b>Calibration (predicted vs actual)</b><table><tr><th>Prob band</th><th>n</th><th>Predicted</th><th>Actual</th></tr>`+bk.map(([a,b])=>{const x=db.filter(p=>p.prob>=a&&p.prob<b);return `<tr><td>${a*100}–${b*100}%</td><td>${x.length}</td><td>${x.length?f(100*mean(x.map(p=>p.prob))):"–"}</td><td>${f(rate(x))}</td></tr>`}).join("")+`</table><div class="lg">If higher bands win less than lower bands (the table-tennis failure), the engine's confidence is not informative: the shrink above will compress it.</div></div>`;
  h+=`<div class="card"><b>By grade / side</b><table><tr><th>Group</th><th>n</th><th>Hit</th></tr>`+["PLAY","LEAN"].map(g=>{const x=db.filter(p=>p.grade===g);return `<tr><td>${g}</td><td>${x.length}</td><td>${f(rate(x))}</td></tr>`}).join("")+["OVER","UNDER"].map(s=>{const x=db.filter(p=>p.side===s);return `<tr><td>${s}</td><td>${x.length}</td><td>${f(rate(x))}</td></tr>`}).join("")+"</table></div>";
  $("#learn").innerHTML=h;
}

/* ===================== WIRING ===================== */
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id==="s-"+b.dataset.s));
  if(b.dataset.s==="t")renderTracker();if(b.dataset.s==="l")renderLearn();if(b.dataset.s==="p")renderParlay()};
$("#bT").onclick=()=>{DAY=0;$("#bT").classList.add("pri");$("#bN").classList.remove("pri");load()};
$("#bN").onclick=()=>{DAY=1;$("#bN").classList.add("pri");$("#bT").classList.remove("pri");load()};
$("#bR").onclick=()=>{Object.keys(formC).forEach(k=>delete formC[k]);load()};
$("#bS").onclick=settle;
$("#bX").onclick=()=>{const t=JSON.stringify(picksDB(),null,2);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>setSt("copied"),()=>setSt("copy failed"))};
$("#bC").onclick=()=>{if(confirm("Clear all tracked picks and learning data?")){store.set("picks",[]);store.set("learn",{});renderTracker();renderLearn()}};
renderTracker();renderLearn();load().then(settle);
setInterval(settle,15*60*1000);
</script></body></html>
